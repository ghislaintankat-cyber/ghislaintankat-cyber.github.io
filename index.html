<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobMarket Cameroon</title>
<!-- Page d'accueil du site racine du compte.
     Elle rend utilisable l'adresse COURTE :
         ghislaintankat-cyber.github.io
     (18 caractères de moins que l'adresse complète, et surtout plus aucune
     majuscule ni orthographe à retenir).
     Le meta refresh est le filet de sécurité si le script est bloqué ;
     le script ci-dessous prend la main avant lui et conserve « ?id=… ». -->
<meta http-equiv="refresh" content="2;url=https://ghislaintankat-cyber.github.io/Jobmarket-cameroon/">
<link rel="canonical" href="https://ghislaintankat-cyber.github.io/Jobmarket-cameroon/">
<meta name="theme-color" content="#0A0A0F">
<style>
  html,body{margin:0;height:100%;background:#0A0A0F;color:#F0F0F8;
            font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .c{height:100%;display:flex;flex-direction:column;align-items:center;
     justify-content:center;gap:14px;text-align:center;padding:24px}
  .logo{width:92px;height:92px;border:3px solid #FFD700;border-radius:22px;
        display:flex;align-items:center;justify-content:center;
        font-size:36px;font-weight:800;color:#FFD700;letter-spacing:1px}
  h1{margin:0;font-size:20px;color:#FFD700}
  p{margin:0;font-size:14px;color:#9999BC}
  a{display:inline-block;margin-top:8px;background:#25D366;color:#062814;
    text-decoration:none;font-weight:800;padding:14px 28px;border-radius:26px}
</style>
</head>
<body>
  <div class="c">
    <div class="logo">JM</div>
    <h1>JobMarket Cameroon</h1>
    <p>Ouverture de l'application…</p>
    <a id="go" href="https://ghislaintankat-cyber.github.io/Jobmarket-cameroon/">Continuer</a>
  </div>
<script>
(function () {
  try {
    var CIBLE = "https://ghislaintankat-cyber.github.io/Jobmarket-cameroon/";
    // on conserve « ?id=… » (profil partagé) et « #job=… » (annonce partagée)
    var suite = (location.search || "") + (location.hash || "");
    var go = document.getElementById("go");
    if (go) go.setAttribute("href", CIBLE + suite);
    location.replace(CIBLE + suite);
  } catch (e) {}
})();
</script>
</body>
</html>
